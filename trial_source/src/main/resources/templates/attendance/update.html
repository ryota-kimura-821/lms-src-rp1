<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<div th:if="${attendanceForm} != null">
		<th:block th:object="${attendanceForm}">
			<div th:each="error:${#fields.detailedErrors()}" class="input-invalid">
				<span th:text="${error.message}"></span>
			</div>
		</th:block>
	</div>


	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>
	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post" th:object="${attendanceForm}">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w250">コース内容</th>
							<th class="w70">出勤</th>
							<th class="w70">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : ${attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:field="*{attendanceList[__${stat.index}__].isToday}" />
									<input type="hidden"
										th:field="*{attendanceList[__${stat.index}__].studentAttendanceId}" />
									<input type="hidden" th:field="*{attendanceList[__${stat.index}__].trainingDate}" />
									<input type="hidden"
										th:field="*{attendanceList[__${stat.index}__].dispTrainingDate}" />
									<input type="hidden" th:field="*{attendanceList[__${stat.index}__].sectionName}" />
									<input type="hidden"
										th:field="*{attendanceList[__${stat.index}__].statusDispName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].index|"
										th:value="${stat.index}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>

								<!-- 新規作成 -->

								<!-- 出勤時間 -->
								<td class="w70">
									<div class="form-flex">
										<select class="form-control start-hour"
											th:field="*{attendanceList[__${stat.index}__].trainingStartTimeHour}"
											th:errorclass="errorInput">
											<!-- 時：未選択 -->
											<option value=""
												th:selected="${#strings.isEmpty(dailyAttendanceForm.trainingStartTimeHour)}">
											</option>
											<!-- 時：00～23 -->
											<option th:each="trainingTimeHour:${attendanceForm.trainingTimeHour}"
												th:value="${trainingTimeHour.key}" th:text="${trainingTimeHour.value}">
											</option>
										</select>
										：
										<select class="form-control start-minute"
											th:field="*{attendanceList[__${stat.index}__].trainingStartTimeMinute}"
											th:errorclass="errorInput">
											<!-- 分：未選択 -->
											<option value=""
												th:selected="${#strings.isEmpty(dailyAttendanceForm.trainingStartTimeMinute)}">
											</option>
											<!-- 分：00～59 -->
											<option th:each="trainingTimeMinute:${attendanceForm.trainingTimeMinute}"
												th:value="${trainingTimeMinute.key}"
												th:text="${trainingTimeMinute.value}">
											</option>
										</select>
									</div>
<!-- デバッグ用								<div style="font-size: 10px; color: blue;">
										errorCheck Hour: [[${#fields.hasErrors('attendanceList[' + stat.index +
										'].trainingStartTimeHour')}]]
										errorCheck Minute: [[${#fields.hasErrors('attendanceList[' + stat.index +
										'].trainingStartTimeMinute')}]]
								</div>
-->								</td>

								<!-- 退勤時間 -->
								<td class="w70">
									<div class="form-flex">
										<select class="form-control end-hour"
											th:field="*{attendanceList[__${stat.index}__].trainingEndTimeHour}"
											th:errorclass="errorInput">
											<!-- 時：未選択 -->
											<option value=""
												th:selected="${#strings.isEmpty(dailyAttendanceForm.trainingEndTimeHour)}">
											</option>
											<!-- 時：00～23 -->
											<option th:each="trainingTimeHour:${attendanceForm.trainingTimeHour}"
												th:value="${trainingTimeHour.key}" th:text="${trainingTimeHour.value}">
											</option>
										</select>
										：
										<select class="form-control end-minute"
											th:field="*{attendanceList[__${stat.index}__].trainingEndTimeMinute}"
											th:errorclass="errorInput">
											<!-- 分：未選択 -->
											<option value=""
												th:selected="${#strings.isEmpty(dailyAttendanceForm.trainingEndTimeMinute)}">
											</option>
											<!-- 分：00～59 -->
											<option th:each="trainingTimeMinute:${attendanceForm.trainingTimeMinute}"
												th:value="${trainingTimeMinute.key}"
												th:text="${trainingTimeMinute.value}">
											</option>
										</select>
									</div>
								</td>

								<!-- ここまで -->

								<td class="w120">
									<select class="form-control"
										th:field="*{attendanceList[__${stat.index}__].blankTime}"
										th:errorclass="errorInput">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inline="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w100">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" class="form-control"
										th:field="*{attendanceList[__${stat.index}__].note}"
										th:errorclass="errorInput"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" id="confirm" />

				</div>

			</form>
		</div>
	</div>

	<!-- 新規作成 -->

	<!-- 「更新」ボタン押下時に確認ダイアログを表示 -->
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const confirm = document.getElementById('confirm');

			confirm.addEventListener('click', function (event) {
				const confirmed = window.confirm('更新します。よろしいですか？');
				if (!confirmed) {
					event.preventDefault(); // 「キャンセル」押下時フォーム送信をキャンセル
				}
			});
		});
	</script>

	<!-- ここまで -->

</body>

</html>
